[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxread"
version = "0.1.0"
description = "Text-to-speech audio reader — Python engine + TypeScript CLI wrapper"
requires-python = ">=3.10"
dependencies = [
    "gTTS>=2.5",
    "pyttsx3>=2.90",
    "pypdf>=4.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "click>=8.1",
    "flask>=3.0",
    "flask-cors>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy"]

[tool.black]
line-length = 88

[project.scripts]
voxread = "tts_reader.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tts_reader*"]
